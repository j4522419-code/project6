# Builds ready-to-run PairShare downloads and publishes them as a GitHub Release.
#
#   git tag v1.2.3 && git push origin v1.2.3
#
# or run it by hand from the Actions tab ("Run workflow") with a tag name.
# Release notes come from docs/release-notes/<tag>.md when that file exists.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v1.0.1 (created from the selected branch if it doesn't exist)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test -c Release

  build:
    needs: test
    strategy:
      fail-fast: true
      matrix:
        include:
          - { rid: win-x64, os: windows-latest }
          - { rid: win-arm64, os: windows-latest }
          - { rid: osx-arm64, os: macos-latest }
          - { rid: osx-x64, os: macos-latest }
          - { rid: linux-x64, os: ubuntu-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish single-file app
        shell: bash
        run: |
          dotnet publish src/PairShare -c Release -r ${{ matrix.rid }} --self-contained \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -p:DebugType=None -p:DebugSymbols=false \
            -p:Version="${TAG#v}" \
            -o out

      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path out/* -DestinationPath "dist/PairShare-$env:TAG-${{ matrix.rid }}.zip"

      - name: Zip (macOS / Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          chmod +x out/PairShare
          (cd out && zip -9 -r "../dist/PairShare-${TAG}-${{ matrix.rid }}.zip" .)

      - uses: actions/upload-artifact@v4
        with:
          name: PairShare-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum *.zip > SHA256SUMS.txt)
          ls -la dist

          notes="docs/release-notes/${TAG}.md"
          if [ -f "$notes" ]; then notes_args=(--notes-file "$notes"); else notes_args=(--generate-notes); fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "PairShare ${TAG}" --target "$GITHUB_SHA" "${notes_args[@]}"
          fi
